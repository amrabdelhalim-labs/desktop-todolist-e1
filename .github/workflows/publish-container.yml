name: Container

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/amrabdelhalim-labs/desktop-todolist-e1

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event_name == 'push' && github.ref_name || 'pr-check' }}
            ${{ github.event_name == 'push' && format('{0}:latest', env.IMAGE_NAME) || '' }}
      - name: Verify published architectures
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${GITHUB_REF_NAME}"
